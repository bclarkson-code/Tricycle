[project]
name = "tricycle"
version = "0.1.0"
description = "A Deep Learning library you can actually understand"
authors = [
    { name = "benedictclarkson1", email = "benedictclarkson1@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
dependencies = ["austin-dist>=3.7.0,<4", "austin-tui>=1.2.3,<2"]


[tool.isort]
profile = "black"
line_length = 79

[tool.black]
line-length = 79

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]


[tool.pixi.tasks]
clean = "rm -rf build"
configure = { depends-on = [
    "clean",
], cmd = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug" }
build = { cmd = "cmake --build build" }
temp = { depends-on = ["build"], cmd = "python tests/test_attention.py" }
ruff = "ruff"

[tool.pixi.pypi-dependencies]
tricycle = { path = ".", editable = true }
richbench = "*"
torch = "*"
# we only use torch for testing so i'll disable it temporarily
# torch = { version = ">=2.0", index = "pytorch-cuda-12.1" }
humanize = "*"
tqdm = "*"
ruff = "*"
tiktoken = "*"
datasets = "*"
pytest = "*"


[tool.pixi.dependencies]
python = ">=3.10"
cuda-toolkit = "12.6.*"
cudnn = "8.9.*"
python-cudnn-frontend = "*"
cmake = "*"
ninja = "*"
cupy = "*"
meson = "*"
ccache = "*"
numba = "*"
clang-format = "*"
triton = { version = "*", channel = "conda-forge" }
matplotlib = ">=3.10.0,<4"
py-spy = ">=0.4.0,<0.5"

[project.optional-dependencies]
test = ["pytest"]

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
